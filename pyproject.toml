[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eve-courier-route-optimizer"
version = "1.5.0"
description = "Proof-capable route optimization for EVE Online public courier contracts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Bolde-Swoup"}]
requires-python = ">=3.12"
keywords = ["eve-online", "courier", "route-optimization", "cp-sat"]
dependencies = [
    "ortools>=9.15,<9.16",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/Bolde-Swoup/Eve-Courrier-Route-Optimizer"
Repository = "https://github.com/Bolde-Swoup/Eve-Courrier-Route-Optimizer"
Issues = "https://github.com/Bolde-Swoup/Eve-Courrier-Route-Optimizer/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[project.scripts]
eve-courier = "eve_courier_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eve_courier_optimizer = ["data/*.sqlite3", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=eve_courier_optimizer --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "live: opt-in tests that call CCP ESI",
]

[tool.coverage.run]
branch = true
source = ["eve_courier_optimizer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
