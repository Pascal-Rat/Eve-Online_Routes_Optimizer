name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tools tests benchmarks
      - run: mypy src tools tests benchmarks
      - run: pytest
      - run: PYTHONPATH=src python -m benchmarks.run_frozen --time-limit 10
      - name: Verify wheel build
        run: python -m pip wheel . --no-deps -w dist
