name: Purge retained CI data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ci.yml']
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete retained CI data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for endpoint in artifacts caches; do
            case "$endpoint" in
              artifacts) selector='.artifacts[].id' ;;
              caches) selector='.actions_caches[].id' ;;
            esac
            # Snapshot every page before deleting entries.
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/$endpoint?per_page=100" \
              --jq "$selector" > "$RUNNER_TEMP/ci-storage-ids"
            deleted=0
            while IFS= read -r item_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/$endpoint/$item_id"
              deleted=$((deleted + 1))
            done < "$RUNNER_TEMP/ci-storage-ids"
            remaining=$(gh api "repos/$GITHUB_REPOSITORY/actions/$endpoint?per_page=1" --jq .total_count)
            echo "Deleted $deleted $endpoint; remaining: $remaining"
            test "$remaining" -eq 0
          done
